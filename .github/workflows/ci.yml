name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: cd server && npm ci
      
      - name: Security audit
        run: cd server && npm audit --audit-level=high
        continue-on-error: true
      
      - name: Check for vulnerabilities
        run: cd server && npx better-npm-audit audit --level high
        continue-on-error: true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: cd server && npm ci
      
      - name: Run tests
        run: cd server && npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: portfolio-tracker-pro:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker container starts
        run: |
          docker run -d --name test-container -p 8080:8080 portfolio-tracker-pro:test
          sleep 10
          # Show container logs if curl fails
          curl -f http://localhost:8080/api/tickers/popular || (docker logs test-container && exit 1)
          docker stop test-container

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-security, test, docker-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd server && npm ci
          npx playwright install --with-deps chromium
      
      - name: Start server
        run: |
          cd server && node index.js &
          sleep 5
        env:
          JWT_SECRET: test-secret-key-for-ci
      
      - name: Run E2E tests
        run: cd server && npx playwright test
        env:
          BASE_URL: http://localhost:8080
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 7
