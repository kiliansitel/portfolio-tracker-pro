name: CI Pipeline

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: cd server && npm ci
      
      - name: Security audit
        run: cd server && npm audit --audit-level=high
        continue-on-error: true
      
      - name: Check for vulnerabilities
        run: cd server && npx better-npm-audit audit --level high
        continue-on-error: true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: cd server && npm ci
      
      - name: Run tests
        run: cd server && npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: portfolio-tracker-pro:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker container starts
        run: |
          docker run -d --name test-container -p 8080:8080 -e JWT_SECRET=test-secret-key-for-ci portfolio-tracker-pro:test
          sleep 10
          curl -f http://localhost:8080/api/tickers/popular || (docker logs test-container && exit 1)
          docker stop test-container

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Run in parallel — don't wait for other jobs
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: cd server && npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd server && npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      
      - name: Start server
        run: |
          cd server && node index.js &
          # Wait for server to be ready instead of blind sleep
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/tickers/popular > /dev/null 2>&1 && break; sleep 1; done
        env:
          JWT_SECRET: test-secret-key-for-ci
      
      - name: Run E2E tests
        run: cd server && npx playwright test
        env:
          BASE_URL: http://localhost:8080
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 7
