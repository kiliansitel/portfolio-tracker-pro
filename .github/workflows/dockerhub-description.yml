name: Update Docker Hub Description

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/DOCKER.md'
  workflow_dispatch:

# Only needs to read the repo; the Docker Hub update uses DOCKERHUB_* secrets.
# NOTE: pin peter-evans/dockerhub-description to a commit SHA and use a Docker Hub
# token scoped to description updates rather than a full-access token.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kiliansitel/portfolio-tracker-pro
          short-description: "TradingView-inspired portfolio tracker with real-time prices, charts, and alerts"
          readme-filepath: ./README.md
