version: '3.8'

services:
  portfolio-tracker-beta:
    build: .
    container_name: portfolio-tracker-beta
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      # Separate volume for beta data
      - portfolio-data-beta:/app/data
    environment:
      - NODE_ENV=production
      - APP_ENV=beta
      - JWT_SECRET=${JWT_SECRET_BETA:-change-this-beta-secret-in-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/tickers/popular"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  portfolio-data-beta:
    driver: local
