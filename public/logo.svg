<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2962ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26a69a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#26a69a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#26a69a;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1e222d"/>
  
  <!-- Chart area fill -->
  <path d="M80 380 L140 320 L200 340 L280 200 L360 240 L432 160 L432 380 Z" 
        fill="url(#grad2)"/>
  
  <!-- Chart line -->
  <path d="M80 380 L140 320 L200 340 L280 200 L360 240 L432 160" 
        stroke="url(#grad1)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>
  
  <!-- Data points -->
  <circle cx="140" cy="320" r="12" fill="#2962ff"/>
  <circle cx="200" cy="340" r="12" fill="#2962ff"/>
  <circle cx="280" cy="200" r="12" fill="#26a69a"/>
  <circle cx="360" cy="240" r="12" fill="#26a69a"/>
  <circle cx="432" cy="160" r="14" fill="#26a69a" stroke="#fff" stroke-width="3"/>
  
  <!-- "P" letter overlay -->
  <text x="256" y="300" 
        font-family="Arial, sans-serif" 
        font-size="180" 
        font-weight="bold" 
        fill="rgba(255,255,255,0.15)" 
        text-anchor="middle">P</text>
</svg>